#cloud-config
# One droplet, one cron line, one container. Not applied; see README.md in this folder.
# Placeholders are filled by deploy-droplet.sh from values the operator exports, never from git.
package_update: true
packages: [ca-certificates, curl, gnupg]
users:
  - name: agent
    groups: [docker]
    shell: /bin/bash
    sudo: false
    ssh_authorized_keys:
      - "SSH_PUBLIC_KEY"
write_files:
  - path: /srv/agent/beat.cron
    permissions: "0644"
    content: |
      # every 30 minutes: one beat; beat.sh's lock refuses an overlap
      */30 * * * * agent /usr/bin/docker run --rm -v /srv/agent/config.json:/app/picoclaw/config.json:ro -v /srv/agent/.security.yml:/app/picoclaw/.security.yml:ro -v /srv/agent/runs:/app/runs -e PICOCLAW_CONFIG=/app/picoclaw/config.json REGISTRY_IMAGE >> /srv/agent/cron.log 2>&1
  - path: /etc/logrotate.d/agent-beat
    permissions: "0644"
    content: |
      /srv/agent/cron.log /srv/agent/runs/*.log { size 5M rotate 4 compress missingok notifempty }
runcmd:
  - install -d -o agent -g agent -m 0750 /srv/agent /srv/agent/runs
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker agent
  # The registry credential and the two secret files are placed by the operator's hand over SSH:
  #   /srv/agent/config.json      (from picoclaw/config.template.json, workspace /app/picoclaw/workspace)
  #   /srv/agent/.security.yml    (model_list.route-normal.api_keys only; mode 0600, owner agent)
  #   docker login registry.digitalocean.com  (read-only registry token)
  - cp /srv/agent/beat.cron /etc/cron.d/agent-beat
  - chmod 0644 /etc/cron.d/agent-beat
