# Built-by: @projectx.sui · Co-authored-by: Claude
# Every commit, on a machine that has never seen this project before.
#
# That last part is the point. Two of the most expensive failures in this repository's history were
# invisible locally and would have been caught here on the first run:
#
#   - `tsc` reused an incremental cache from before a type became nullable and reported success
#     while twelve real errors sat in the tree. A clean checkout has no cache to reuse.
#   - A production build was run while `next dev` was serving, overwriting the chunks the dev server
#     was mid-flight serving. The browser kept showing older code and the edits appeared to do
#     nothing. Nothing here shares a directory with anything.
#
# The Move suite runs alongside the application's, because the contracts are the half that holds the
# money and a green web suite says nothing about them.

name: CI

# WHAT RUNS HERE, AND WHY IT IS NOT EVERYTHING
#
# Tests run on the laptop this is built on. That is the gate, and it is deliberate: Postgres 16,
# the prover and the chain are all there, the run is measured in seconds rather than minutes, and a
# failure is read by the person who caused it while the change is still in their head.
#
# So this file keeps only the two checks a laptop cannot honestly make about itself:
#
#   Secret scan   — a local pre-commit hook is per-checkout and will always be missing somewhere.
#                   This is the copy that cannot be skipped, and the repository is on a publication
#                   path, so a secret that lands here is public whatever we do afterwards.
#   Digest guard  — the deployed contract's build digest. It guards the half that holds the money,
#                   and it is checked against what is on chain rather than against this tree.
#
# The application and Move suites still exist below and still run on a clean machine — but on
# request and on a weekly schedule, not on every commit. They are not deleted, because the header
# comment they carry names two real failures that were invisible locally: a stale incremental
# typecheck cache, and a production build poisoned by a dev server sharing its directory. Those are
# clean-machine failures and a laptop cannot rule them out. They are simply not worth a full run
# per commit when every one of those tests has already passed locally.
#
# Run them by hand at any time: Actions -> CI -> Run workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Sunday, early. Far from anybody's working hours, so a red result is read on Monday morning
    # rather than mistaken for a break in whatever is being worked on.
    - cron: '23 4 * * 0'

# A second push supersedes the first. Nobody needs the results of a commit that has been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The secret scanner, which until now ran nowhere.
  #
  # It existed, `install-hooks.sh` installed it as a pre-commit hook, and `core.hooksPath` was
  # empty in at least one working checkout with no `.git/hooks/pre-commit` — so it guarded nothing
  # there and said nothing about it. install-hooks.sh warns about exactly that case: "every other
  # checkout committed with no guard at all and nothing said so."
  #
  # A local hook is per-checkout and will always be missing somewhere. This is the copy that cannot
  # be skipped, and it is deliberately its own job: a scanner that only runs after a two-minute
  # typecheck is a scanner people wait for rather than one that stops them.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # CI has no .env, so this run is PATTERNS ONLY and the scanner now says so rather than
      # printing CLEAN. The identity rule -- exact containment of a value read from a live .env --
      # is the strongest of the three and cannot run here. That is a real limit of this job and it
      # is stated rather than papered over: CI catches the shapes, a local commit with the
      # environment present catches the values.
      - name: Scan every tracked file
        run: python3 scripts/scan-secrets.py --all

  web:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Typecheck, tests, build
    runs-on: ubuntu-latest

    # A real database, because the build reads one.
    #
    # `RightRail` runs in the root layout and queries the content store, so prerendering any page
    # touches Postgres. `lib/db.ts` refuses to invent a connection string — deliberately, since a
    # default is how a deployment silently writes to the wrong database — so the build fails
    # without one, and it is right to. Giving CI a real database is the honest answer; opting pages
    # out of prerendering to dodge it would be hiding the dependency rather than meeting it.
    #
    # This is also the service the route-level tests will need.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: projectx_social
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PROJECTX_DATABASE_URL: postgres://postgres:ci@localhost:5432/projectx_social
      # Route tests truncate every table, so they are given their own database and refuse to run
      # against the one above. The name must end in _test; the helper checks it.
      PROJECTX_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/projectx_social_test

    steps:
      - uses: actions/checkout@v7

      # No `version` here on purpose. The root package.json pins pnpm with an integrity hash, and
      # the action reads it from there — naming it twice makes the action refuse outright, and the
      # copy that is not hash-pinned is the weaker of the two anyway.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` so a drifted lockfile fails here rather than resolving to a different
      # dependency tree than the one anybody tested against.
      - run: pnpm install --frozen-lockfile

      # The SDK is consumed as compiled JavaScript through its `exports` map, so it must be built
      # before anything that imports it is typechecked.
      - run: pnpm --filter @projectx-social/sdk build

      # In file-name order, which is the order they were written to run in.
      - name: Apply migrations
        working-directory: packages/web
        run: |
          createdb -h localhost -U postgres projectx_social_test
          for db in "$PROJECTX_DATABASE_URL" "$PROJECTX_TEST_DATABASE_URL"; do
            for f in db/*.sql; do
              psql "$db" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
          done
        env:
          PGPASSWORD: ci

      - name: Typecheck (no incremental cache)
        working-directory: packages/web
        run: |
          rm -f tsconfig.tsbuildinfo
          pnpm typecheck

      # Three test files read `.env.local` at module scope for the chain ids, and it is gitignored
      # — so on a fresh checkout the read throws ENOENT while the file is being imported. That is
      # not a failing test: it is a file that never collects, and eighteen tests that report
      # neither pass nor fail because nothing reaches them. Every developer has a `.env.local`, so
      # it passed locally and failed here for twenty consecutive runs.
      #
      # `.env.example` is committed and carries the live mainnet ids — the package, platform,
      # registry and key-registry objects — with the secret entries deliberately blank. Copying it
      # gives those files the configured deployment they expect, out of a source that is in the
      # repository and reviewable.
      - name: Configuration for tests that need a configured deployment
        run: cp .env.example packages/web/.env.local

      # Every package that defines a `test` script, not just this one.
      #
      # This step read `working-directory: packages/web` / `pnpm test` until 2026-09-01, which
      # resolved to the WEB package's script and nothing else. The root script is `pnpm -r test`
      # and CI never invoked it, so seven of the eight TypeScript packages were outside the gate
      # for the whole life of this workflow: the SDK that defines the bytes of every signature,
      # the daemon that signs mainnet transactions hourly against a funded wallet, the signer and
      # policy packages that enforce spend limits, and the MCP server. Their suites passed when
      # somebody ran them by hand and were unchecked between those times. `#56` merged with a
      # failing SDK suite and eight green checks.
      #
      # `-r` also means a package added later is gated the day it gains a test script, rather than
      # the day somebody remembers to add a line here.
      #
      # `--no-bail`, inside the root script, so one failing package does not hide the state of the
      # others. The run still exits non-zero; it just reports every failure instead of the first.
      #
      # THE ROOT SCRIPT BUILDS THE SDK FIRST, and that is the fix rather than a tidiness. It is
      # `pnpm --filter @projectx-social/sdk build && pnpm -r --no-bail test`, so the rebuild is a
      # precondition of the tests in the same string and cannot be separated from them by an edit
      # that looks harmless. `packages/sdk/dist` is gitignored: it is whatever was last built on
      # that machine and it does NOT change when you switch branches, so testing without rebuilding
      # produces results for a mixture of two commits. That was observed twice on a developer
      # machine on 2026-09-01, the second time by the person who had written the warning — the
      # symptom is a correct implementation failing with a plausible assertion error, which reads
      # exactly like a real defect.
      #
      # CI was already safe here by accident, because a build step happens to run earlier in this
      # job. A developer's checkout was not, and `pnpm test` is what a developer types.
      #
      # NOT covered, and this step must not be read as claiming otherwise: `packages/room` defines
      # no `test` script at all, so `-r` skips it silently. Six packages are newly gated here
      # (sdk, agent, daemon, policy, signer, mcp); room has no tests for any gate to run.
      - name: Tests
        run: pnpm test

      # Configuration is supplied per environment and has no defaults — a build that silently
      # substituted a plausible package id would be building against a chain nobody chose. These are
      # public facts (object ids on mainnet), so they are repository *variables*, never secrets.
      # A missing one fails the build loudly, which is the intended behaviour.
      - name: Build
        working-directory: packages/web
        env:
          NEXT_DIST_DIR: .next-ci
          PROJECTX_SOCIAL_NETWORK: ${{ vars.PROJECTX_SOCIAL_NETWORK }}
          PROJECTX_SOCIAL_PACKAGE_ID: ${{ vars.PROJECTX_SOCIAL_PACKAGE_ID }}
          PROJECTX_SOCIAL_LATEST_PACKAGE_ID: ${{ vars.PROJECTX_SOCIAL_LATEST_PACKAGE_ID }}
          PROJECTX_SOCIAL_PLATFORM_ID: ${{ vars.PROJECTX_SOCIAL_PLATFORM_ID }}
          PROJECTX_SOCIAL_VAULT_COIN_TYPES: ${{ vars.PROJECTX_SOCIAL_VAULT_COIN_TYPES }}
        run: pnpm build

  contracts:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Move tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the contracts were published and tested with. A floating toolchain
      # means a framework revision can change what compiles without a line of this repository
      # changing, and the first sign of it would be a red build nobody can attribute.
      # The version is READ FROM `Published.toml` rather than written here, so this workflow and the
      # package cannot drift apart. It was a hardcoded `mainnet-v1.77.2` until 2026-09-01, which
      # meant two places recorded the toolchain and only one of them was ever updated.
      - name: Install Sui CLI, at the version the package pins
        run: |
          SUI_VERSION="mainnet-v$(sed -n 's/^[[:space:]]*toolchain-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' sui-contracts/Published.toml | head -1)"
          [ "$SUI_VERSION" != "mainnet-v" ] || { echo "no toolchain-version in Published.toml"; exit 1; }
          echo "installing $SUI_VERSION"
          curl -sSL -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf sui.tgz -C "$HOME/.local/bin" --strip-components=1 || tar -xzf sui.tgz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/sui"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: sui --version

      # STRICT here, because CI is the one place where a toolchain difference is never intentional:
      # the workflow just installed the pinned version, so a mismatch means the install did not do
      # what it said, or something else on PATH is winning. That is a shadowed binary, which is the
      # exact defect this file was added for — a stale sui in ~/.local/bin silently won every command
      # on a developer machine for months, and the first symptom was an upgrade ceremony failing.
      - name: The compiler is the one this package is pinned to
        run: bash sui-contracts/assert-toolchain.sh --strict

      # The deployed-drift tripwire: weir v3 is live on mainnet, and source that stops building
      # to the recorded package digest fails here, on the pull request, instead of during an
      # upgrade ceremony. Updating ci-expected-digest is a deliberate act that rides an
      # intended upgrade commit.
      # Runs BEFORE any digest comparison, in its own job, so its verdict is its own.
      #
      # Until 2026-09-01 this step sat after the digest guard in the same job. On a pull request
      # that changes the contracts on purpose — which is every upgrade — the guard fails first by
      # design, the job stops, and this step never runs. The check named "Move tests" was then red
      # for a reason that had nothing to do with the tests, and a suite that actually failed on
      # such a branch was indistinguishable from one that passed: it had not run. PR #93 ran 131
      # tests locally and zero in CI for exactly that reason.
      - name: Move tests
        working-directory: sui-contracts
        run: sui move test

      # The agent's mind is a SEPARATE package, `agent_mind`, that depends on `projectx_social`
      # through `../sui-contracts`. Same pinned compiler, same job, its own build and its own tests.
      # It is published on its own and has its own digest file (see sui-contracts/DIGESTS.md).
      - name: Move build (agent_mind)
        working-directory: sui-contracts-mind
        run: sui move build

      - name: Move tests (agent_mind)
        working-directory: sui-contracts-mind
        run: sui move test

  digest:
    name: Digest guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the contracts were published and tested with. A floating toolchain
      # means a framework revision can change what compiles without a line of this repository
      # changing, and the first sign of it would be a red build nobody can attribute.
      # The version is READ FROM `Published.toml` rather than written here, so this workflow and the
      # package cannot drift apart. It was a hardcoded `mainnet-v1.77.2` until 2026-09-01, which
      # meant two places recorded the toolchain and only one of them was ever updated.
      - name: Install Sui CLI, at the version the package pins
        run: |
          SUI_VERSION="mainnet-v$(sed -n 's/^[[:space:]]*toolchain-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' sui-contracts/Published.toml | head -1)"
          [ "$SUI_VERSION" != "mainnet-v" ] || { echo "no toolchain-version in Published.toml"; exit 1; }
          echo "installing $SUI_VERSION"
          curl -sSL -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf sui.tgz -C "$HOME/.local/bin" --strip-components=1 || tar -xzf sui.tgz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/sui"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: sui --version

      # STRICT here, because CI is the one place where a toolchain difference is never intentional:
      # the workflow just installed the pinned version, so a mismatch means the install did not do
      # what it said, or something else on PATH is winning. That is a shadowed binary, which is the
      # exact defect this file was added for — a stale sui in ~/.local/bin silently won every command
      # on a developer machine for months, and the first symptom was an upgrade ceremony failing.
      - name: The compiler is the one this package is pinned to
        run: bash sui-contracts/assert-toolchain.sh --strict

      # The deployed-drift tripwire: weir v3 is live on mainnet, and source that stops building
      # to the recorded package digest fails here, on the pull request, instead of during an
      # upgrade ceremony. Updating ci-expected-digest is a deliberate act that rides an
      # intended upgrade commit.
      - name: Digest guard
        working-directory: sui-contracts
        run: |
          EXPECTED="$(tr -d '[:space:]' < ci-expected-digest)"
          # Build first, on its own, with stderr visible: a build failure must fail this step
          # with the compiler's error in the log, not surface as a JSON parse error over empty
          # stdout — that opaque shape is exactly how this gate's first real run died.
          #
          # --no-tree-shaking keeps the dump offline. Without it the dump tree-shakes the
          # dependency list through RPC calls, and on a fresh runner that path produced an
          # empty dump with exit code 0. Both dependencies are used, so shaking is a no-op
          # here: the flag changes nothing about the digest, verified against
          # ci-expected-digest with the same pinned CLI.
          sui move build --dump-bytecode-as-base64 --no-tree-shaking > build-dump.json
          echo "digest-guard: dump size $(wc -c < build-dump.json) bytes"
          # The runner's dump is not clean JSON the way a local one is — parse from the first
          # '{' so leading terminal noise cannot break the guard, and when no JSON object is
          # found at all, print the head of the file verbatim so the log shows what the CLI
          # actually wrote instead of a JSONDecodeError over invisible bytes.
          ACTUAL="$(python3 - <<'PY'
          import json, sys
          raw = open('build-dump.json', 'rb').read()
          start = raw.find(b'{')
          if start < 0:
              sys.stderr.write('digest-guard: no JSON object in dump; first 300 bytes: %r\n' % raw[:300])
              sys.exit(1)
          try:
              dump = json.loads(raw[start:])
          except Exception as e:
              sys.stderr.write('digest-guard: dump not parseable as JSON (%s); first 300 bytes: %r\n' % (e, raw[:300]))
              sys.exit(1)
          print(bytes(dump['digest']).hex())
          PY
          )"
          rm -f build-dump.json
          # Two digests are legitimate: the one recorded as DEPLOYED (ci-expected-digest) and, on
          # an upgrade branch, the one recorded as INTENDED (ci-next-digest). The second file is
          # written on purpose, by hand, with the pinned compiler, and it is what turns "source
          # drifted" into "source changed to exactly what somebody meant". Without it every upgrade
          # PR was red on this check by design for its whole life, and a check that is red by
          # design is a check nobody reads — which is the failure this guard exists to prevent.
          # The ceremony commit promotes next -> expected and deletes ci-next-digest.
          NEXT=""; [ -f ci-next-digest ] && NEXT="$(tr -d '[:space:]' < ci-next-digest)"
          # An unfinished ceremony, refused before the comparison rather than tolerated by it.
          #
          # ci-next-digest exists only while an upgrade is in flight, and the ceremony commit copies
          # it into ci-expected-digest and DELETES it. When the two files are equal the copy happened
          # and the delete did not, which leaves this guard with a second door standing permanently
          # open: any later corruption of ci-expected-digest passes through the next branch instead
          # of failing here.
          #
          # Found on 2026-09-03 by mutation-testing this guard. The v5 ceremony promoted and did not
          # delete, so a deliberately corrupted ci-expected-digest did NOT fail. The guard was sound;
          # the leftover file was the defect. Equal files are never a legitimate state, so they are
          # refused rather than reported.
          if [ -n "$NEXT" ] && [ "$NEXT" = "$EXPECTED" ]; then
            echo "digest-guard: ci-next-digest is identical to ci-expected-digest."
            echo "That is an upgrade ceremony that promoted the digest and did not delete the next file."
            echo "Delete sui-contracts/ci-next-digest. It exists only while an upgrade is in flight."
            exit 1
          fi
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "digest-guard: OK — matches the deployed digest ($ACTUAL)"
          elif [ -n "$NEXT" ] && [ "$ACTUAL" = "$NEXT" ]; then
            echo "digest-guard: OK — matches ci-next-digest, the intended upgrade ($ACTUAL); deployed is $EXPECTED"
          else
            echo "digest-guard: MISMATCH — expected $EXPECTED${NEXT:+ or next $NEXT}, built $ACTUAL"
            echo "If this change is intended, record the built digest in ci-next-digest in this commit (or in ci-expected-digest in the ceremony commit)."
            exit 1
          fi

