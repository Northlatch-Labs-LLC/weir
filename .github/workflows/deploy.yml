name: Deploy to Vercel

# Vercel's Hobby plan cannot connect to a private repository owned by an
# organisation, so pushes no longer reach Vercel on their own. This workflow
# does what that connection used to do: build with the Vercel CLI and ship the
# prebuilt output to production.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # This is a pnpm workspace; the Vercel CLI shells out to pnpm during the
      # build and fails with ENOENT if it is not on PATH first. The version is
      # deliberately not set here — package.json already pins it via
      # packageManager, and declaring it twice is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
