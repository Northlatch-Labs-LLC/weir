name: Deploy to Vercel

# Production deploys for weir.social.
#
# History, because the header of an older version of this file gets quoted:
#
#   - This workflow originally ran on every push to main. CI was a separate workflow
#     with no relationship to it, so a red tree shipped to production exactly as fast
#     as a green one, and the suite everybody quoted had never gated a single deploy.
#
#   - 2026-09-02: the automatic path was removed on the belief that Vercel's Hobby plan
#     cannot connect to a repository owned by an organisation, and that branch
#     protection is unavailable on this plan. Both beliefs were wrong. The repository
#     is public; branch protection, rulesets and environment protection are free for
#     public repositories on every plan. Removing the path did not strengthen the gate —
#     it moved production onto human memory, where forgetting the button left the site
#     running old code with nothing to say so.
#
#   - Now the automatic path is back, gated on the real thing. CI runs the full suite
#     (secret scan, digest guard, the web suite, the Move suite) on every push to main.
#     This workflow fires only when that run concluded green, and only on the exact
#     commit CI tested — never on whatever main has drifted to by the time the run ends.
#
# The `production` environment (Settings -> Environments) can additionally require a
# named reviewer before the job is allowed to start. That is free on public repositories
# and is the strongest gate in the chain; branch protection on main remains worth
# enabling for the merge itself.
#
# What a successful run leaves behind:
#
#   - A deployment record on the commit (Repositories -> Environments -> production), so
#     "what is live" is a query, not a memory.
#   - `prod-build-<sha>`: the exact prebuilt output that was shipped, kept 30 days.
#     Rolling back is downloading it and `vercel deploy --prebuilt --prod` — no rebuild,
#     no gap between what was tested and what is restored.
#   - drift-alarm.yml diffs the record against main every night and files an issue when
#     the two part ways.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # A cancelled or failed CI run must never deploy, and a manual dispatch has no CI
    # event to read — both cases are spelled out rather than implied.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # `workflow_run` starts from the default branch, NOT from the commit that triggered CI, so
      # without this the deploy would ship whatever main happened to be at the time the run began
      # rather than the commit that was actually tested. Deploying an untested commit because the
      # gate said green would be worse than having no gate.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Pin the commit being deployed
        id: pinned
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The `production` environment auto-creates a deployment record the moment the
      # job starts; asking GitHub to create a second one for the same sha is refused
      # (HTTP 409) and fails an otherwise-green run. Find the record that already
      # exists and reuse it — looked up BEFORE the deploy so that both the success and
      # the failure marker can address it no matter where the run stops. Creation is
      # only a fallback for a record that does not exist yet.
      - name: Find the deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_ID=$(gh api "repos/Northlatch-Labs-LLC/weir/deployments?environment=production&sha=${{ steps.pinned.outputs.sha }}" \
            --jq '.[0].id // ""')
          if [ -z "$DEPLOY_ID" ]; then
            DEPLOY_ID=$(gh api repos/Northlatch-Labs-LLC/weir/deployments \
              -f ref=${{ steps.pinned.outputs.sha }} \
              -f environment=production \
              -f task=deploy \
              -F auto_merge=false \
              -f 'required_contexts[]=' \
              --jq '.id')
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "deployment record: $DEPLOY_ID"

      - name: Say what is being deployed, and why it was allowed
        run: |
          echo "commit:    ${{ steps.pinned.outputs.sha }}"
          echo "trigger:   ${{ github.event_name }}"
          echo "CI result: ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"

      # This is a pnpm workspace; the Vercel CLI shells out to pnpm during the
      # build and fails with ENOENT if it is not on PATH first. The version is
      # deliberately not set here — package.json already pins it via
      # packageManager, and declaring it twice is an error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: |
          set -o pipefail
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee deploy-output.txt

      # The first *.vercel.app URL in the output is the new production deployment; the
      # alias to weir.social is printed after it and does not match the pattern.
      - name: Remember the production URL
        run: |
          echo "prod_url=$(grep -Eo 'https://[^ ]+\.vercel\.app' deploy-output.txt | head -1)" >> "$GITHUB_ENV"

      - name: Keep the exact bits that shipped
        uses: actions/upload-artifact@v7
        with:
          name: prod-build-${{ steps.pinned.outputs.short }}
          path: .vercel/output
          retention-days: 30

      # The deployment record is what drift-alarm.yml reads. It is created only here,
      # after the alias succeeded, so the newest record is the live truth.
      # The record was found or created before the deploy ran; this only flips it to
      # the live truth after the alias succeeded.
      - name: Mark the deployment live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Northlatch-Labs-LLC/weir/deployments/${{ env.deploy_id }}/statuses \
            -f state=success \
            -f environment_url=https://weir.social

      - name: Mark the deployment failed
        if: failure() && env.deploy_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Northlatch-Labs-LLC/weir/deployments/${{ env.deploy_id }}/statuses \
            -f state=failure
