name: Migrate

# A merged migration must be an applied migration. Nothing used to guarantee that: deploys ship
# code, backups copy data, and the schema moved only when a person remembered to run a file by
# hand — which is how `044_error_events.sql` reached main and never reached production, leaving
# the product without its error record while looking healthy.
#
# What this workflow is now, after the operator ruled out CI holding any write credential to
# production ("no secrets, no published private keys"):
#
#   A DRIFT WATCH, not an applier. With the read-only credential the repo already holds it reads
#   the ledger and reports. Production stays writable only by the app itself and by the operator
#   working directly — through the authenticated Supabase CLI session, as when the ledger was
#   seeded and 044 applied on 2026-11-12. That is one credential in one place, and no runner can
#   write to the database even if every GitHub secret leaks at once.
#
# Applying a migration is therefore deliberate work with the CLI, not a checkbox. The workflow's
# job is to make forgetting it loud: a scheduled run that finds pending migrations fails, files
# an issue, and closes it when the ledger is clean again.

on:
  schedule:
    # Ten past four, after the 03:17 backup. A drift discovered here is discovered with a fresh
    # backup from the same morning sitting in the artifacts.
    - cron: '10 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Supabase direct host resolves to IPv6 only and GitHub runners have no IPv6 route, so the
      # pooler rewrite below is copied verbatim from backup.yml and error-alarm.yml. Session mode
      # (5432): the ledger read is one query, and session mode is what the other readers use.
      - name: Resolve an IPv4 session-mode connection
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::BACKUP_DATABASE_URL is not set, so there is no ledger to read."
            exit 1
          fi
          URL=$(python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse, urlunparse
          u = urlparse(os.environ['DATABASE_URL'])
          m = re.match(r'^db\.([a-z0-9]+)\.supabase\.co$', u.hostname or '')
          if m:
              ref = m.group(1)
              region = os.environ.get('SUPABASE_REGION', 'eu-west-2')
              u = u._replace(
                  netloc=f'postgres.{ref}:{u.password or ""}@aws-0-{region}.pooler.supabase.com:5432'
              )
          print(urlunparse(u))
          PY
          )
          echo "::add-mask::$URL"
          echo "PROJECTX_DATABASE_URL=$URL" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @projectx-social/web

      # migrate.mjs runs read-only unless --apply or --baseline is passed, and neither flag is
      # here. The read-only credential cannot write anyway, so the guard is doubled: the tool
      # would refuse and the database would refuse.
      - name: Report the schema ledger
        run: |
          node packages/web/scripts/migrate.mjs | tee ledger.txt
          if grep -q 'pending' ledger.txt; then
            echo "drift=found" >> "$GITHUB_ENV"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Production has migrations main has not applied. This is how error_events was dead for a week."
            fi
          else
            echo "drift=clean" >> "$GITHUB_ENV"
          fi

      - name: File an issue when production is behind main
        if: env.drift == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='MIGRATE: production schema is behind main'
          NUMBER=$(gh issue list --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          {
            echo "The migration check at $(date -u '+%Y-%m-%d %H:%MZ') found pending migrations:"
            echo
            echo '```'
            cat ledger.txt
            echo '```'
            echo
            echo 'CI holds a read-only credential by design, so applying is deliberate work:'
            echo
            echo '```'
            echo 'supabase db query --linked --file packages/web/db/<the-file>.sql'
            echo 'echo + record the row in schema_migrations (see scripts/migrate.mjs for the checksum)'
            echo '```'
            echo
            echo 'Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            echo
            echo 'This issue closes itself when a run reports no pending migrations.'
          } > body.md
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --body-file body.md
          else
            gh issue comment "$NUMBER" --body-file body.md
          fi

      - name: Close the issue when the ledger is clean
        if: success() && env.drift == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='MIGRATE: production schema is behind main'
          NUMBER=$(gh issue list --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Ledger is clean as of $(date -u '+%Y-%m-%d %H:%MZ')."
          fi
