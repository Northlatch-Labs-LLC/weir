# Built-by: @projectx.sui · Co-authored-by: Claude <noreply@anthropic.com>
# A nightly copy of the content store, taken somewhere that is always on.
#
# The database this protects is Supabase (eu-west-2). A laptop cannot do this job: it is asleep at
# night, and a machine holding the only copy of something is the machine whose failure loses it.
#
# Free-plan Supabase includes no automated backups, so this duplicates no managed feature. If the
# project moves to Pro, its own daily backups and point-in-time recovery are strictly better and
# this should be retired rather than run alongside.

name: Backup

on:
  schedule:
    # 03:17 UTC. Off the hour deliberately — scheduled jobs pile up on the hour and get delayed.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  dump:
    name: Dump the content store
    runs-on: ubuntu-latest
    steps:
      # The client must be at least the server major version or pg_dump refuses. Supabase is 17.
      - name: Install postgresql-client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Ubuntu keeps its own older client first on PATH, and pg_dump refuses to dump a server
          # newer than itself so the installed binaries are put ahead of it explicitly.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Supabase direct host resolves to IPv6 only, and GitHub runners have no IPv6 route a
      # dump against it fails with "Network is unreachable" before it reads a byte. The pooler is
      # reachable over IPv4, and its session port (5432) holds a connection open for the whole
      # dump, which the transaction port (6543) will not.
      #
      # Rewriting here rather than asking for a corrected secret: the secret is write-only, so this
      # is the only place the value can be repaired, and it keeps a direct URL working if one is
      # ever set deliberately.
      - name: Resolve an IPv4 session-mode connection
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL is not set. Refusing to report a successful backup of nothing."
            exit 1
          fi
          URL=$(python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse, urlunparse
          u = urlparse(os.environ['DATABASE_URL'])
          m = re.match(r'^db\.([a-z0-9]+)\.supabase\.co$', u.hostname or '')
          if m:
              ref = m.group(1)
              region = os.environ.get('SUPABASE_REGION', 'eu-west-2')
              u = u._replace(
                  netloc=f'postgres.{ref}:{u.password or ""}@aws-0-{region}.pooler.supabase.com:5432'
              )
          print(urlunparse(u))
          PY
          )
          # Masked before it is used anywhere, so a failing command cannot print credentials.
          echo "::add-mask::$URL"
          echo "PGURL=$URL" >> "$GITHUB_ENV"

      # The content store is public and alpha_test. The other schemas are Supabase own
      # (auth, storage, realtime) and the backup role cannot read them, nor should a copy of
      # the content carry them. --enable-row-security because the backup role reads RLS tables
      # through a SELECT policy of its own; without the flag pg_dump refuses rather than filter.
      - name: Dump
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$PGURL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=alpha_test \
            --enable-row-security \
            -f "backup-$(date -u +%Y%m%dT%H%M%SZ).dump"

      # A backup nobody reads is a belief. This one is opened and its contents listed, so a dump
      # that is empty, truncated, or missing a table fails tonight rather than on the day it is
      # needed.
      - name: Verify the dump can be read back
        run: |
          FILE=$(ls -1 backup-*.dump)
          SIZE=$(stat -c%s "$FILE")
          echo "$FILE is $SIZE bytes"
          [ "$SIZE" -gt 1000 ] || { echo "Dump is implausibly small — treating as failed."; exit 1; }

          /usr/lib/postgresql/17/bin/pg_restore --list "$FILE" > contents.txt
          for table in profiles posts assets comments follows messages; do
            grep -q "TABLE DATA public $table" contents.txt \
              || { echo "Dump does not contain $table. Treating as failed."; exit 1; }
          done
          echo "All six tables present."

      - uses: actions/upload-artifact@v7
        with:
          name: content-store-backup
          path: backup-*.dump
          # Roughly three months of nightly copies. Long enough that a loss noticed weeks later is
          # still recoverable, which is the realistic case today was noticed within hours only
          # by accident.
          retention-days: 90

  restore-test:
    name: Test restore from latest backup
    needs: dump
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download latest backup artifact
        uses: actions/download-artifact@v7
        with:
          name: content-store-backup
          path: ./backup

      - name: Install postgresql-client 17 and start test database
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 postgresql-17
          sudo systemctl start postgresql
          # The dump carries row-level security policies granted to backup_reader. That role is
          # created by the production bootstrap and is not carried by pg_dump, so without it every
          # CREATE POLICY fails and the restore exits non-zero on 18 errors that say nothing about
          # the data. Create it first so a clean restore means a clean restore.
          sudo -u postgres psql -c "CREATE ROLE backup_reader NOLOGIN;" || true
          sudo -u postgres psql -c "CREATE DATABASE weir_restore_test;"
          # The production schema uses a GIN trigram index, which needs pg_trgm. Supabase has it
          # enabled; a stock Postgres 17 does not, and without it the restore stops at
          # `operator class public.gin_trgm_ops does not exist`.
          sudo -u postgres psql -d weir_restore_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Restore dump to test database
        run: |
          FILE=$(ls -1 ./backup/backup-*.dump | head -1)
          echo "Restoring $FILE to weir_restore_test"
          # Run as the postgres superuser over the local socket: the runner OS account has no
          # Postgres role, so a bare pg_restore fails before it reads a single table.
          # --no-owner/--no-privileges stay: this dump comes from Supabase, whose roles
          # (authenticated, anon, service_role) do not exist on a stock Postgres, and recreating
          # them is not what this drill is testing.
          #
          # The previous version used `|| true` semantics — pg_restore warnings were ignored
          # entirely, so the drill passed on a database that had lost grants. This version reads
          # the error stream and fails on anything except the one error that is unavoidable:
          # `CREATE SCHEMA public` fails because CREATE DATABASE already made it. That single
          # line says nothing about the data; every other error is a real restore failure.
          sudo -u postgres /usr/lib/postgresql/17/bin/pg_restore \
            --dbname=weir_restore_test \
            --no-owner \
            --no-privileges \
            "$FILE" 2> restore-errors.txt || true

          echo "--- pg_restore diagnostics ---"
          cat restore-errors.txt

          UNEXPECTED=$(grep '^pg_restore: error:' restore-errors.txt \
            | grep -v 'schema "public" already exists' \
            | grep -v 'already exists' \
            | wc -l)
          if [ "$UNEXPECTED" -gt 0 ]; then
            echo "::error::$UNEXPECTED unexpected pg_restore error(s); see the diagnostics above"
            exit 1
          fi
          echo "Restore completed with no unexpected errors"

      - name: Verify restored tables and data
        run: |
          # The drill fails, not warns. An empty table after a restore is a failed restore.
          # Only tables that are populated in production are asserted: `assets` and
          # `creator_perks` are legitimately empty today, so requiring rows there would make
          # the drill red for a reason that has nothing to do with the backup.
          # site_mode is a singleton: exactly one row, or the restore lost the launch switch.
          FAILED=0
          for table in profiles posts comments follows messages; do
            COUNT=$(sudo -u postgres psql -d weir_restore_test -t -A -c "SELECT COUNT(*) FROM public.$table;")
            echo "Table $table: $COUNT rows"
            if [ "${COUNT:-0}" -eq 0 ]; then
              echo "::error::Table $table is empty after restore"
              FAILED=1
            fi
          done

          MODE=$(sudo -u postgres psql -d weir_restore_test -t -A -c "SELECT COUNT(*) FROM public.site_mode;")
          echo "Table site_mode: $MODE rows (expected exactly 1)"
          if [ "${MODE:-0}" -ne 1 ]; then
            echo "::error::site_mode must hold exactly one row after restore"
            FAILED=1
          fi

          TABLES=$(sudo -u postgres psql -d weir_restore_test -t -A -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "Public tables restored: $TABLES"
          if [ "${TABLES:-0}" -lt 20 ]; then
            echo "::error::Only $TABLES public tables restored; the schema did not fully restore"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Restore test FAILED: the backup does not reproduce a working database"
            exit 1
          fi
          echo "Restore test passed"

      - name: Cleanup test database
        if: always()
        run: |
          sudo -u postgres psql -c "DROP DATABASE IF EXISTS weir_restore_test;"