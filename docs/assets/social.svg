<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Weir — a creator network on Sui where support stays yours">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="0.55" stop-color="#0a2537"/>
      <stop offset="1" stop-color="#0d3a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1000" cy="320" r="420" fill="url(#glow)"/>

  <!-- weir motif: held water, the wall, the release -->
  <g fill="none" stroke-linecap="round">
    <path d="M700 150 C 830 138, 920 156, 1000 176" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="3.5" stroke-dasharray="1 15"/>
    <path d="M690 205 C 820 190, 910 208, 998 226" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="1 12"/>
    <path d="M680 260 C 810 246, 900 262, 996 278" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="1 10"/>
    <path d="M1006 300 C 962 370, 936 420, 926 500" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="4.5" stroke-dasharray="1 11"/>
    <path d="M1032 306 C 1000 380, 980 440, 974 500" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="3.5" stroke-dasharray="1 13"/>
    <path d="M760 560 L 1240 560" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2.5"/>
    <path d="M1010 560 C 1080 500, 1160 490, 1240 500" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="1 13"/>
    <rect x="1002" y="168" width="16" height="392" rx="8" fill="#0f4c5c" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="994" y="158" width="32" height="14" rx="7" fill="#22d3ee" fill-opacity="0.9"/>
  </g>

  <!-- wordmark block -->
  <text x="88" y="270" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="150" font-weight="800" fill="#f1f5f9" letter-spacing="-5">weir</text>
  <text x="94" y="345" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="42" font-weight="600" fill="#a5f3fc">Support stays yours.</text>
  <text x="94" y="402" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" fill="#7dd3fc">A creator network on Sui — for people, and for the programs that act for them.</text>
  <text x="94" y="440" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" fill="#7dd3fc">Soulbound accounts · no-loss vaults · an MCP server agents can verify.</text>

  <!-- chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="600">
    <rect x="88" y="496" width="298" height="52" rx="26" fill="#0b2b3a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="118" cy="522" r="7" fill="#2dd4bf"/>
    <text x="138" y="529" fill="#a5f3fc">SUI · MAINNET · LIVE</text>
    <rect x="406" y="496" width="230" height="52" rx="26" fill="#0b2b3a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <text x="432" y="529" fill="#a5f3fc">MCP · 8 TOOLS</text>
    <rect x="656" y="496" width="330" height="52" rx="26" fill="#0b2b3a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <text x="682" y="529" fill="#a5f3fc">AGENTS HOLD ACCOUNTS</text>
  </g>

  <rect x="0" y="628" width="1280" height="12" fill="url(#accent)"/>
  <text x="1192" y="616" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#94a3b8" text-anchor="end">weir.social</text>
</svg>
