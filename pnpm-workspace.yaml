# Built-by: @projectx.sui · Co-authored-by: Claude <noreply@anthropic.com>
packages:
  - "packages/*"
  # Wren is a host recipe, not a JavaScript package: shell, systemd units, Python helpers,
  # policy documents. It declares no dependencies, publishes nothing and is imported by nothing.
  # A member with no dependencies gets no importer entry in the lockfile, and a builder running
  # an older pnpm than the one that wrote it refuses a frozen install over the absence. Its own
  # tests run on `node --test`; `pnpm wren:test` at the root is the way in.
  - "!packages/wren"

# The publishable packages cross-reference each other by real version number rather than
# `workspace:*`, because npm cannot resolve that protocol from a registry. Without this, pnpm takes
# those numbers literally and installs the PUBLISHED tarball of a package sitting in this
# repository — so `packages/mcp` would build and test against whatever was last released instead of
# the source beside it, and a change to `packages/agent/src` would not reach it. Verified: without
# this line, packages/mcp/node_modules/@projectx-social/agent points into .pnpm rather than at
# ../../agent.
#
# It lived in `.npmrc` until pnpm 12. pnpm 10 moved workspace configuration into this file and
# ignores the .npmrc entry silently, which is the worst way for a setting like this to stop working.
linkWorkspacePackages: true
# Build scripts run only for packages named here. pnpm 10 stopped running dependency lifecycle
# scripts by default, which is the right default — a postinstall is arbitrary code from a package
# you may never have read. esbuild's fetches its own platform binary and genuinely needs one.
allowBuilds:
  esbuild: true
# A package published in the last 24 hours is refused, because that is the window in which a
# compromised publish is usually caught. The four below are ours: they are published from this
# repository, so the quarantine would be refusing our own release.
minimumReleaseAgeExclude:
  - '@projectx-social/agent@1.0.2'
  - '@projectx-social/policy@1.0.2'
  - '@projectx-social/sdk@1.0.2'
  - '@projectx-social/signer@1.0.2'

# Security floors for packages no direct dependency can reach.
#
# These are transitive: proxy-addr arrives through express inside the MCP server, follow-redirects
# through the Sui SDK, vite through vitest. A pnpm audit against this lockfile reported 35
# advisories, one critical (proxy-addr, IP spoofing via IPv4-mapped IPv6) and thirteen high.
#
# A floor rather than a pin: any version at or above the patched release is acceptable, so a later
# dependency can still move them forward. They live here and not in package.json because pnpm 10
# moved workspace configuration into this file and ignores the old location silently — which is
# exactly how the first attempt at this failed.
overrides:
  proxy-addr: ">=2.0.8"
  body-parser: ">=2.4.0"
  follow-redirects: ">=1.16.3"
  fast-uri: ">=3.1.9"
  qs: ">=6.17.1"
  source-map-js: ">=1.2.2"
  ip-address: ">=10.7.4"
  vite: ">=8.2.4"
  hono: ">=4.13.11"
  "@hono/node-server": ">=2.1.3"
  "@vitest/mocker": ">=5.0.3"
  happy-dom: ">=21.0.4"
